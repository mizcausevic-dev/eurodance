name: materialize

on:
  workflow_dispatch:

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore generator sources
        run: |
          cat source.b64.1 source.b64.2 source.b64.3 | base64 -d > /tmp/eurodance-src.tar.gz
          echo "774a153f21529b95c0feeafd2620cd29d609f7e6840c4452391250680bc3cbab  /tmp/eurodance-src.tar.gz" | sha256sum -c -
          tar -xzf /tmp/eurodance-src.tar.gz

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Build pack
        run: python3 tools/build_pack.py

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "Materialize Eurodance MIDI pack [skip ci]"
            git push
          fi

      - name: Enable GitHub Pages from main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/" \
          || gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/"
